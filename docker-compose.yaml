services:
  svelte:
    build:
      dockerfile: Dockerfile.svelte.prod
    container_name: fst-frontend
    restart: always
    # Remove external port exposure, only accessible via internal network
    expose:
      - "80"      # Website Port
    networks:
      - internal_network

